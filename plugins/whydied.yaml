apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: whydied
spec:
  version: v0.1.0
  homepage: https://github.com/DanilaZanin/kubectl-whydied
  shortDescription: Explain why a container or pod died or restarted
  description: |
    Reads pod status, events, the owner chain and node state, and prints why a
    container or pod died or restarted. Every claim carries its evidence (source
    object, UID, time) and a confidence label: confirmed, likely or no data.
    No LLM, no network calls except to the Kubernetes API. Events expire, so
    the tool can only explain what the API still holds.
  caveats: |
    Reads pods, events, nodes and owner objects (ReplicaSets, Deployments, Jobs,
    StatefulSets, DaemonSets). Missing RBAC permissions are reported as gaps, not
    guessed around. Node OOM and cloud provider interruptions are not classified
    in v0.1.
  platforms:
    # sha256 values are filled in from checksums.txt of the release.
    - selector:
        matchLabels: {os: linux, arch: amd64}
      uri: https://github.com/DanilaZanin/kubectl-whydied/releases/download/v0.1.0/kubectl-whydied_v0.1.0_linux_amd64.tar.gz
      sha256: REPLACE_WITH_SHA256_FROM_checksums.txt
      bin: kubectl-whydied
    - selector:
        matchLabels: {os: linux, arch: arm64}
      uri: https://github.com/DanilaZanin/kubectl-whydied/releases/download/v0.1.0/kubectl-whydied_v0.1.0_linux_arm64.tar.gz
      sha256: REPLACE_WITH_SHA256_FROM_checksums.txt
      bin: kubectl-whydied
    - selector:
        matchLabels: {os: darwin, arch: amd64}
      uri: https://github.com/DanilaZanin/kubectl-whydied/releases/download/v0.1.0/kubectl-whydied_v0.1.0_darwin_amd64.tar.gz
      sha256: REPLACE_WITH_SHA256_FROM_checksums.txt
      bin: kubectl-whydied
    - selector:
        matchLabels: {os: darwin, arch: arm64}
      uri: https://github.com/DanilaZanin/kubectl-whydied/releases/download/v0.1.0/kubectl-whydied_v0.1.0_darwin_arm64.tar.gz
      sha256: REPLACE_WITH_SHA256_FROM_checksums.txt
      bin: kubectl-whydied
    - selector:
        matchLabels: {os: windows, arch: amd64}
      uri: https://github.com/DanilaZanin/kubectl-whydied/releases/download/v0.1.0/kubectl-whydied_v0.1.0_windows_amd64.zip
      sha256: REPLACE_WITH_SHA256_FROM_checksums.txt
      bin: kubectl-whydied.exe
    - selector:
        matchLabels: {os: windows, arch: arm64}
      uri: https://github.com/DanilaZanin/kubectl-whydied/releases/download/v0.1.0/kubectl-whydied_v0.1.0_windows_arm64.zip
      sha256: REPLACE_WITH_SHA256_FROM_checksums.txt
      bin: kubectl-whydied.exe
