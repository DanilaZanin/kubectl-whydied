apiVersion: v1
kind: Pod
metadata:
  name: oom
  labels: {app: oom}
spec:
  restartPolicy: Always
  containers:
  - name: app
    image: busybox:1.37
    imagePullPolicy: IfNotPresent
    command: ["sh", "-c", "echo allocating; a=0123456789abcdef; while true; do a=\"$a$a\"; done"]
    resources:
      limits: {memory: 32Mi}
      requests: {memory: 16Mi}
