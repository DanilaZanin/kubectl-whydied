apiVersion: apps/v1
kind: Deployment
metadata:
  name: scaled
spec:
  replicas: 2
  selector: {matchLabels: {app: scaled}}
  template:
    metadata:
      labels: {app: scaled}
    spec:
      terminationGracePeriodSeconds: 90
      containers:
      - name: app
        image: busybox:1.37
        imagePullPolicy: IfNotPresent
        command: ["sleep", "3600"]
