apiVersion: v1
kind: Pod
metadata:
  name: liveness-kill
  labels: {app: liveness-kill}
spec:
  restartPolicy: Always
  containers:
  - name: app
    image: busybox:1.37
    imagePullPolicy: IfNotPresent
    command: ["sh", "-c", "touch /tmp/healthy; sleep 5; rm -f /tmp/healthy; sleep 3600"]
    livenessProbe:
      exec: {command: ["cat", "/tmp/healthy"]}
      initialDelaySeconds: 1
      periodSeconds: 2
      failureThreshold: 2
