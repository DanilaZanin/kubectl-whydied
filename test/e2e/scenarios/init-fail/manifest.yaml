apiVersion: v1
kind: Pod
metadata:
  name: init-fail
  labels: {app: init-fail}
spec:
  restartPolicy: Always
  initContainers:
  - name: setup
    image: busybox:1.37
    imagePullPolicy: IfNotPresent
    command: ["sh", "-c", "echo init failing >&2; exit 3"]
  containers:
  - name: app
    image: busybox:1.37
    imagePullPolicy: IfNotPresent
    command: ["sleep", "3600"]
