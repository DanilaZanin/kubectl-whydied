apiVersion: v1
kind: Pod
metadata:
  name: startup-kill
  labels: {app: startup-kill}
spec:
  restartPolicy: Always
  containers:
  - name: app
    image: busybox:1.37
    imagePullPolicy: IfNotPresent
    command: ["sh", "-c", "sleep 3600"]
    startupProbe:
      exec: {command: ["cat", "/tmp/never-created"]}
      periodSeconds: 2
      failureThreshold: 3
